name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validation:
    name: Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall -q .

      - name: Import smoke test
        run: |
          python -c "
          import importlib
          import importlib.util
          import extract_data
          import utils.column_mapper
          import utils.data_formatter
          import utils.facultad_matcher
          import utils.file_reader
          import utils.proper_nouns
          optional_modules = [
              'modules.date_comparison.comparator',
              'modules.date_comparison.date_extractor',
              'modules.date_comparison.pdf_reader',
              'modules.date_comparison.autofill',
              'modules.date_comparison.rowstate',
              'modules.date_comparison.consistency',
          ]
          for module_name in optional_modules:
              try:
                  spec = importlib.util.find_spec(module_name)
              except (ImportError, ModuleNotFoundError):
                  spec = None
              if spec is not None:
                  importlib.import_module(module_name)
          print('imports ok')
          "

      - name: Unit tests
        run: |
          python -m unittest discover -s tests -p "test_formatting.py" -v
          python -m unittest discover -s tests -p "test_autofill.py" -v
          python -m unittest discover -s tests -p "test_consistency.py" -v
          python -m unittest discover -s tests -p "test_file_reader.py" -v
          python -m unittest discover -s tests -p "test_date_extractor_targets.py" -v

  integration:
    name: Integration
    needs: validation
    runs-on: ubuntu-latest
    environment: ${{ (github.ref_name == 'main' && 'production') || (github.ref_name == 'dev' && 'dev') || 'pr' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Integration tests
        run: python -m unittest discover -s tests -p "test_integration.py" -v