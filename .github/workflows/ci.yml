name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validation:
    name: Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall -q extract_data.py utils modules scripts tests

      - name: Import smoke test
        run: python -c "import extract_data; import utils.column_mapper, utils.data_formatter, utils.facultad_matcher, utils.file_reader, utils.proper_nouns; import modules.date_comparison.comparator, modules.date_comparison.date_extractor, modules.date_comparison.pdf_reader; print('imports ok')"

      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_formatting.py" -v

  integration:
    name: Integration
    needs: validation
    runs-on: ubuntu-latest
    environment: ${{ (github.ref_name == 'main' && 'production') || (github.ref_name == 'dev' && 'dev') || 'pr' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Integration tests
        run: python -m unittest discover -s tests -p "test_integration.py" -v